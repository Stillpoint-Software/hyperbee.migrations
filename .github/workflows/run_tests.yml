name: Run Tests

# Per-provider integration matrix: each Couchbase/Postgres/MongoDB/etc. job
# spawns ONLY its own provider's containers (via HYPERBEE_TESTS_PROVIDERS_ONLY)
# and runs ONLY tests targeting that provider (via FullyQualifiedName filter).
# This eliminates the resource pressure that came from one job spinning up
# all 5 provider containers simultaneously on a 4-CPU / 16 GB GitHub-hosted
# runner -- the pressure was amplifying eventual-consistency races inside
# Couchbase Server (CREATE SCOPE/COLLECTION/INDEX vs N1QL planner-catalog)
# and surfacing them as test flakiness. Unit tests run separately because
# they need no containers at all.

on:
  workflow_run:
    workflows: [Create Release]
    types: [requested]
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.set_branch.outputs.branch_name }}
      configuration: ${{ steps.set_branch.outputs.configuration }}

    steps:
      - id: set_branch
        shell: bash
        run: |
          # Pick the ref to test for each trigger type.
          # For pull_request, test the PR head SHA (the incoming changes),
          # not the base branch. Using the SHA is deterministic even if
          # the PR branch is later force-pushed.
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            RAW='${{ github.event.workflow_run.head_sha }}'
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RAW='${{ github.event.pull_request.head.sha }}'
          else
            RAW='${{ github.ref }}'
          fi

          # Strip the refs/heads/ prefix if present.
          CLEAN="${RAW#refs/heads/}"

          echo "Detected ref: $CLEAN"
          echo "branch_name=$CLEAN" >> "$GITHUB_OUTPUT"

          if [[ "$CLEAN" == "main" ]]; then
            echo "configuration=Release" >> "$GITHUB_OUTPUT"
          else
            echo "configuration=Debug" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------ unit
  unit-tests:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.discover.outputs.branch_name }}
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Restore + Build (Hyperbee.Migrations.sln)
        run: |
          dotnet restore ${{ vars.SOLUTION_NAME }}
          dotnet build ${{ vars.SOLUTION_NAME }} \
            --no-restore \
            -c ${{ needs.discover.outputs.configuration }}

      - name: Unit tests (${{ matrix.framework }})
        run: |
          shopt -s globstar nullglob
          mkdir -p ./TestResults

          # Run every test project EXCEPT the integration project. Each is
          # container-free and runs in seconds.
          for proj in tests/Hyperbee.Migrations.Tests/Hyperbee.Migrations.Tests.csproj \
                      tests/Hyperbee.Migrations.Squash.Tests/Hyperbee.Migrations.Squash.Tests.csproj \
                      tests/Hyperbee.Migrations.Cli.Tests/Hyperbee.Migrations.Cli.Tests.csproj; do
            echo "::group::Unit: $proj (${{ matrix.framework }})"
            dotnet test "$proj" \
              --no-build \
              -c ${{ needs.discover.outputs.configuration }} \
              -f ${{ matrix.framework }} \
              --logger "trx;LogFileName=$(basename "$proj" .csproj)-${{ matrix.framework }}.trx" \
              --results-directory ./TestResults
            echo "::endgroup::"
          done

      - name: Upload unit test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-unit-${{ matrix.framework }}
          path: ./TestResults/
          if-no-files-found: warn

  # ------------------------------------------------------------------ integration
  # The GATING integration tier (ADR-0031). Selects positively on
  # [TestCategory("Gating")]: tests that talk to one shared provider container
  # through the provider client, finish in seconds, and have no recorded flake
  # history. Everything heavier stays [TestCategory("LocalOnly")] and runs via
  # the manual heavy_integration_tests.yml workflow.
  #
  # Positive selection is deliberate. This job previously filtered NEGATIVELY
  # (`TestCategory!=LocalOnly`), so when every class was tagged LocalOnly in
  # 7ff3808 the filter silently matched zero tests. `dotnet test` fails on a
  # no-match, so the whole job was gated behind a repo variable that was never
  # created -- leaving the repo with no integration coverage in CI and no
  # working way back. A negative filter cannot tell "nothing to run" from
  # "nothing tagged"; a positive one can, and the guard step below asserts it.
  #
  # Per-provider matrix so a runner sees one provider's containers, not five.
  # One TFM only: these assert behavior against a real server, which does not
  # vary by target framework, and the unit + wire tiers already run on all
  # three. Cost is ~3 short jobs per PR instead of 18 long ones.
  integration-tests:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [postgres, mongodb, opensearch, aerospike, multi-provider]
        include:
          - provider: postgres
            providers-only: Postgres
            filter: "FullyQualifiedName~Postgres"
          - provider: mongodb
            providers-only: MongoDb
            filter: "FullyQualifiedName~MongoDB"
          - provider: opensearch
            providers-only: OpenSearch
            filter: "FullyQualifiedName~OpenSearch"
          - provider: aerospike
            providers-only: Aerospike
            filter: "FullyQualifiedName~Aerospike"
          - provider: multi-provider
            providers-only: Postgres,MongoDb
            filter: "FullyQualifiedName~MultiProviderHost"

    env:
      FRAMEWORK: net10.0
      TEST_PROJECT: tests/Hyperbee.Migrations.Integration.Tests/Hyperbee.Migrations.Integration.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.discover.outputs.branch_name }}
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      # No MCR base-image warm step here. That existed because the runner
      # Dockerfiles begin with `FROM mcr.microsoft.com/dotnet/*` and an
      # 18-cell matrix fired ~36 simultaneous pulls, tripping Azure Front
      # Door's WAF. The Gating tier builds no Docker images -- it only pulls
      # the provider images -- so that failure class is gone rather than
      # mitigated. The warm step lives on in heavy_integration_tests.yml,
      # which does build them.

      - name: Restore + Build test project (EnableIntegrationTests)
        # Project-scoped build is enough for the Gating tier: it contains no
        # test that spawns the CLI binary or walks sample assemblies in their
        # own bin folders (that is CliBinaryEndToEndTests, which is LocalOnly).
        run: |
          dotnet restore "$TEST_PROJECT"
          dotnet build "$TEST_PROJECT" \
            --no-restore \
            -c ${{ needs.discover.outputs.configuration }} \
            -f "$FRAMEWORK" \
            /p:EnableIntegrationTests=true

      - name: Guard -- the gating filter must match at least one test
        # The failure this repo already hit once: a filter that matches nothing
        # is indistinguishable from a filter that is working, until `dotnet test`
        # exits non-zero with an opaque message. Surface it by name, before the
        # containers start.
        run: |
          set -uo pipefail
          FILTER='(${{ matrix.filter }})&TestCategory=Gating'
          LIST=$(dotnet test "$TEST_PROJECT" \
            --no-build \
            -c ${{ needs.discover.outputs.configuration }} \
            -f "$FRAMEWORK" \
            --list-tests \
            --filter "$FILTER" \
            /p:EnableIntegrationTests=true 2>&1 || true)
          echo "$LIST"
          if echo "$LIST" | grep -q "No test matches the given testcase filter"; then
            echo "::error::Gating filter matched zero tests for ${{ matrix.provider }}: $FILTER"
            echo "::error::Either a [TestCategory(\"Gating\")] tag was removed, or this provider no longer has gating coverage. Re-tag a light test class or drop this matrix entry -- do not silently skip the job (see ADR-0031)."
            exit 1
          fi

      - name: Integration tests -- ${{ matrix.provider }} (Gating)
        # HYPERBEE_TESTS_PROVIDERS_ONLY restricts the [AssemblyInitialize]
        # container startup to the named provider(s), so a runner starts one
        # provider's containers rather than all five.
        env:
          HYPERBEE_TESTS_PROVIDERS_ONLY: ${{ matrix.providers-only }}
        run: |
          mkdir -p ./TestResults
          dotnet test "$TEST_PROJECT" \
            --no-build \
            -c ${{ needs.discover.outputs.configuration }} \
            -f "$FRAMEWORK" \
            --filter "(${{ matrix.filter }})&TestCategory=Gating" \
            --logger "trx;LogFileName=integration-${{ matrix.provider }}.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults \
            /p:EnableIntegrationTests=true

      - name: Upload integration test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-integration-${{ matrix.provider }}
          path: ./TestResults/
          if-no-files-found: warn

  # ------------------------------------------------------------------ merge
  merge-results:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Download All Test Results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: ./TestResults
          merge-multiple: true

      - name: Upload Combined Results
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: ./TestResults/
          if-no-files-found: warn

      - name: Cleanup Individual Artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: test-results-*
